# Tema oscuro de la interfaz. Los mismos colores están en graficas_gui.py
# (gráficas Plotly) y estilo.py (CSS adicional).

[client]
# Oculta el botón Deploy y deja solo el menú básico
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#38BDF8"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#131C30"
textColor = "#E2E8F0"
borderColor = "#24324D"
showWidgetBorder = true
baseRadius = "6px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
dataframeBorderColor = "#24324D"
dataframeHeaderBackgroundColor = "#131C30"

[theme.sidebar]
backgroundColor = "#0E1627"
secondaryBackgroundColor = "#16213A"
borderColor = "#24324D"
