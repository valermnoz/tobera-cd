# Tema negro de la interfaz. Los mismos colores están en graficas_gui.py
# (gráficas Plotly) y estilo.py (CSS adicional).

[client]
# Oculta el botón Deploy y deja solo el menú básico
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#FF6A1F"
backgroundColor = "#09090B"
secondaryBackgroundColor = "#111113"
textColor = "#F4F4F5"
borderColor = "#27272A"
showWidgetBorder = true
baseRadius = "6px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
dataframeBorderColor = "#27272A"
dataframeHeaderBackgroundColor = "#1A1A1E"

[theme.sidebar]
backgroundColor = "#0C0C0E"
secondaryBackgroundColor = "#141416"
borderColor = "#27272A"
