# Tema grafito con azul profundo de la interfaz. Los mismos colores están en graficas_gui.py
# (gráficas Plotly) y estilo.py (CSS adicional).

[client]
# Oculta el botón Deploy y deja solo el menú básico
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#1F5BD6"
backgroundColor = "#0C0E13"
secondaryBackgroundColor = "#13161D"
textColor = "#E6E8EC"
borderColor = "#272C37"
showWidgetBorder = true
baseRadius = "4px"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
dataframeBorderColor = "#272C37"
dataframeHeaderBackgroundColor = "#1B1F28"

[theme.sidebar]
backgroundColor = "#0F1218"
secondaryBackgroundColor = "#161A22"
borderColor = "#272C37"
