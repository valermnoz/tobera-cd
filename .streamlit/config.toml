# Tema claro de la interfaz. Los mismos colores están en graficas_gui.py
# (gráficas Plotly) y estilo.py (CSS adicional).

[client]
# Oculta el botón Deploy y deja solo el menú básico
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1F5BD6"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F8"
textColor = "#111827"
borderColor = "#DCE1E8"
showWidgetBorder = true
baseRadius = "4px"
# Helvetica (en Windows, que no la trae, se usa Arial, que es casi igual)
font = "'Helvetica Neue', Helvetica, Arial, sans-serif"
headingFont = "'Helvetica Neue', Helvetica, Arial, sans-serif"
codeFont = "Menlo, Consolas, monospace"
dataframeBorderColor = "#DCE1E8"
dataframeHeaderBackgroundColor = "#F3F5F8"

[theme.sidebar]
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#DCE1E8"
